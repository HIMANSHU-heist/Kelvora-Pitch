const scenes=D.map(d=>{
  const root=new T.Group();root.visible=false;sc.add(root);
  const cs=d.c.map((q,i)=>{const g=card(q[0],q[1],q[2],q[3],{i:q[4].i,t:q[4].t,l:q[4].l,c:q[4].c,k:q[4].k});g.scale.setScalar(1e-4);root.add(g);return{g,y:q[1],d:.25+i*.14,i}});
  const fl=(d.f||[]).map((p,j)=>{const a=d.c[p[0]],b=d.c[p[1]],dx=(a[2]+b[2])/2,A=new T.Vector3(a[0]+a[2]/2+.1,a[1],.5),B=new T.Vector3(b[0]-b[2]/2-.1,b[1],.5);
    const g=flow(A,B,a[4].c);g.visible=false;g.userData.d=.5+p[0]*.14;root.add(g);return g});
  let bn=null;if(d.b){bn=banner(d.b[0],d.b[1],d.b[2],d.b[3],d.b[4],d.b[5],d.b[6]);bn.scale.setScalar(1e-4);root.add(bn)}
  const mo=MK[D.indexOf(d)]();root.add(mo.g);
  return{root,cs,fl,bn,W:d.W,H:d.H,mu:mo.u,mg:mo.g}
});

/* UI */
const N=D.length,DUR=9000;let cur=0,mode="auto",playing=false,t0=0,pt=0,px=0,py=0,tx=0,ty=0,started=false;
const dots=$('#dots');D.forEach((_,i)=>{const a=document.createElement('a');a.tabIndex=0;a.setAttribute('aria-label','Scene '+(i+1));a.onclick=()=>go(i);a.onkeydown=e=>{if(e.key=="Enter")go(i)};dots.appendChild(a)});
function go(i){
  cur=cl(i,0,N-1);scenes.forEach((s,k)=>s.root.visible=k===cur);t0=performance.now();pt=0;
  const d=D[cur],cap=$('#cap');$('#tg').textContent=d.g;$('#tt').textContent=d.t;$('#tx').textContent=d.x;
  cap.classList.remove('in');void cap.offsetWidth;cap.classList.add('in');
  $('#num').textContent=String(cur+1).padStart(2,'0')+' / '+String(N).padStart(2,'0');
  [...dots.children].forEach((a,k)=>a.classList.toggle('on',k===cur));fit();
}
function setMode(m){mode=m;document.body.classList.toggle('manual',m=="manual");playing=m=="auto";$('#pp').textContent='⏸ Pause';
  document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.m==m))}
function start(m){setMode(m);$('#splash').classList.add('off');started=true;go(0)}
$('#sa').onclick=()=>start('auto');$('#sm').onclick=()=>start('manual');
document.querySelectorAll('#seg button').forEach(b=>b.onclick=()=>{setMode(b.dataset.m);t0=performance.now()});
$('#pv').onclick=()=>go(cur-1);$('#nx').onclick=()=>go(cur+1);$('#rp').onclick=()=>go(cur);
$('#pp').onclick=()=>{playing=!playing;$('#pp').textContent=playing?'⏸ Pause':'▶ Play';if(playing)t0=performance.now()-pt};
addEventListener('keydown',e=>{if(!started)return;if(e.key=="ArrowRight")go(cur+1);if(e.key=="ArrowLeft")go(cur-1)});
addEventListener('pointermove',e=>{tx=(e.clientX/innerWidth-.5)*2;ty=(e.clientY/innerHeight-.5)*2});

function fit(){
  const w=innerWidth,h=innerHeight,a=w/h,s=scenes[cur],th=Math.tan(20*Math.PI/180);
  R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(w,h,false);cam.aspect=a;cam.updateProjectionMatrix();
  s.dist=Math.max(s.H/2/th,s.W/2/(th*a))*1.1;s.off=-s.H*(a<.8?.2:.13);
}
addEventListener('resize',fit);

const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
function frame(now){
  requestAnimationFrame(frame);
  const s=scenes[cur];if(!s.dist)fit();
  const st=(now-t0)/1000;
  if(playing&&started){pt=now-t0;if(pt>=DUR){if(cur<N-1)go(cur+1);else{playing=false;pt=DUR}}}
  $('#bar i').style.width=(mode=="auto"?cl(pt/DUR,0,1)*100:(cur+1)/N*100)+'%';
  px+=(tx-px)*.05;py+=(ty-py)*.05;
  cam.position.set(px*1.6,s.off-py*1,s.dist);cam.lookAt(0,s.off,0);
  s.cs.forEach(c=>{const p=reduce?1:eb(cl((st-c.d)/.7,0,1));c.g.scale.setScalar(Math.max(1e-4,p));c.g.position.y=c.y+(reduce?0:Math.sin(st*1.5+c.i)*.1)});
  if(s.bn)s.bn.scale.setScalar(Math.max(1e-4,eb(cl((st-.1)/.7,0,1))));
  s.fl.forEach(g=>{g.visible=st>g.userData.d;g.userData.run(st)});
  s.mg.scale.setScalar(Math.max(1e-4,eb(cl(st/1.4,0,1))));s.mu(st);stars.rotation.z=now*.00002;
  R.render(sc,cam);
}
fit();requestAnimationFrame(frame);
})();
